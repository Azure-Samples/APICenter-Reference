name: Register API

on:
  workflow_dispatch:
    inputs:
      resource-id:
        description: 'The resource ID of the API Center'
        required: false
        default: ''
      resource-group:
        description: 'The resource group name of the API Center'
        required: false
        default: ''
      service-name:
        description: 'The service name of the API Center'
        required: false
        default: ''
      file-location:
        description: 'The file path relative to the repository root'
        required: false
        default: ''
      api-management-id:
        description: 'The resource ID of the API Management service'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  register-api:
    runs-on: ubuntu-latest

    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install APIC extension
        shell: bash
        run: |
          az extension add --name apic-extension --allow-preview true --yes

      - name: Login to Azure
        uses: Azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}

      - name: Register API
        shell: bash
        env:
          RESOURCE_ID: ${{ inputs['resource-id'] }}
          RESOURCE_GROUP: ${{ inputs['resource-group'] }}
          SERVICE_NAME: ${{ inputs['service-name'] }}
          FILE_LOCATION: ${{ inputs['file-location'] }}
          API_MANAGEMENT_ID: ${{ inputs['api-management-id'] }}
        run: |
          ./infra/scripts/new-apiregistration.sh \
            --resource-id "$RESOURCE_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --service-name "$SERVICE_NAME" \
            --file-location "$FILE_LOCATION" \
            --api-management-id "$API_MANAGEMENT_ID"
